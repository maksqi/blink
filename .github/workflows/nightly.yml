name: nightly

# Slow and strict checks that never gate pull requests (docs/TESTING.md §6.7-6.9). Every job is a prepared stub that
# stays skipped: nobody sets the repository variable BLINQ_NIGHTLY_STUBS. Stage 10 writes a job's specs and then removes
# that job's `if:` line. Actions are pinned by commit SHA.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NUXT_TELEMETRY_DISABLED: '1'
  E2E_NIGHTLY: '1'

jobs:
  join-time:
    name: Join time p95 < 3 s
    # TODO(Stage 10): enable once call/join-time measures 1 warm-up + 10 warm joins (TESTING.md §6.7).
    if: vars.BLINQ_NIGHTLY_STUBS == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.dev.example .env
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm dev:deps
      - run: sh scripts/e2e.sh --project=chromium --grep @nightly call/join-time

  network-degradation:
    name: Network degradation (tc netem)
    # TODO(Stage 10): enable once the degradation spec exists. It impairs the dev LiveKit container's interface with
    # tc netem through nsenter, so it needs root and runs only here (TESTING.md §6.9).
    if: vars.BLINQ_NIGHTLY_STUBS == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.dev.example .env
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm dev:deps
      - run: sh scripts/e2e.sh --project=chromium --grep @nightly call/degradation

  long-recording:
    name: Long recording (30 min or more)
    # TODO(Stage 10): enable once recording/long covers upload backlog, memory and the partial finalize path
    # (TESTING.md §6.8). ffmpeg and ffprobe come from mwader/static-ffmpeg:9.0.2 as in e2e.yml.
    if: vars.BLINQ_NIGHTLY_STUBS == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.dev.example .env
      - name: ffmpeg and ffprobe 9 (static build)
        run: |
          container=$(docker create mwader/static-ffmpeg:9.0.2)
          sudo docker cp "$container:/ffmpeg" /usr/local/bin/ffmpeg
          sudo docker cp "$container:/ffprobe" /usr/local/bin/ffprobe
          docker rm "$container" > /dev/null
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm dev:deps
      - run: sh scripts/e2e.sh --project=chromium --grep @nightly recording/long

  edge:
    name: Microsoft Edge
    # TODO(Stage 10): enable once playwright.config.ts has an Edge project (channel 'msedge') for nightly runs.
    if: vars.BLINQ_NIGHTLY_STUBS == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.dev.example .env
      - run: pnpm exec playwright install --with-deps msedge
      - run: pnpm dev:deps
      - run: sh scripts/e2e.sh --project=msedge

  macos-webkit:
    name: WebKit with E2EE on macOS (non-blocking)
    # TODO(Stage 10): enable with a native harness. GitHub's macOS runners have no Docker, so Postgres 18, LiveKit
    # v1.13.7 and Caddy 2.11.4 must run natively there (Homebrew binaries) instead of through compose.
    if: vars.BLINQ_NIGHTLY_STUBS == 'enabled'
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "TODO(Stage 10) native harness for macOS WebKit"
