# gitleaks configuration: every default rule, plus an allowlist for the public dev-only values below.
# Run it with `sh scripts/scan-secrets.sh` (CI: ci.yml, job gitleaks).
title = "blinq"

[extend]
useDefault = true

# The dev stack's credentials in .env.dev.example and docker-compose.dev.yml are public placeholders that only work
# against the local dev stack. They are allowlisted by exact value, not by path, so a real secret added to those files
# is still reported. Never reuse these values anywhere else.
[[allowlists]]
description = "Public dev-only placeholders (.env.dev.example, docker-compose.dev.yml)"
regexTarget = "secret"
regexes = [
  # APP_SECRET and LIVEKIT_API_SECRET of the dev stack.
  '''^dev-only-[a-z0-9-]+-not-for-production-[0-9]+$''',
  # RECORDING_ENCRYPTION_KEY of the dev stack: base64 of "dev-only-recording-key-32-bytes!".
  '''^ZGV2LW9ubHktcmVjb3JkaW5nLWtleS0zMi1ieXRlcyE=$''',
  # Bootstrap admin password and Postgres password of the dev stack.
  '''^dev-admin-password-0000$''',
  '''^blinq-dev$''',
]

# Unit and API tests use obvious fake passwords and tokens (word triples, documentation UUIDs). Only the noisy generic
# rule is relaxed there, so real key formats (cloud keys, private keys, JWTs) in tests are still reported.
[[allowlists]]
description = "Fake credentials in tests (generic-api-key only)"
targetRules = ["generic-api-key"]
paths = ['''(^|/)tests/''', '''\.test\.ts$''']

# The alphabet temporary passwords are drawn from is not a secret.
[[allowlists]]
description = "Temporary password alphabet"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''TEMP_PASSWORD_ALPHABET = ''']
